<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Digit Recognizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Kis JavaScript a logók automatikus frissítéséhez
        function submitForm() {
            document.getElementById('uploadForm').submit();
        }
    </script>
</head>
<body class="bg-white text-gray-900 min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
    <header class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-600">
            Számfelismerő AI
        </h1>
        <p class="text-gray-600 mt-2">Tölts fel egy kézzel írt számot!</p>
    </header>

    <div th:if="${error}" class="bg-red-50 border border-red-300 text-red-700 p-3 rounded-lg mb-6 text-sm">
        <p th:text="${error}"></p>
    </div>

    <form id="uploadForm" th:action="@{/predict}" method="post" enctype="multipart/form-data" class="space-y-6">
        <div class="relative group">
            <input type="file" name="file" id="file" class="hidden" onchange="submitForm()" accept="image/*">
            <label for="file" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all">
                <svg class="w-12 h-12 text-gray-400 group-hover:text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <span class="text-sm font-medium text-gray-700 group-hover:text-blue-700">Kattints a kép kiválasztásához</span>
                <span class="text-xs text-gray-500 mt-1">vagy húzd ide a fájlt</span>
            </label>
        </div>
    </form>

    <div th:if="${digit != null}" class="mt-8 p-6 bg-gray-100 rounded-xl border border-gray-200 text-center animate-fade-in">
        <h2 class="text-gray-500 text-sm uppercase tracking-widest font-semibold">Eredmény</h2>
        <div class="text-8xl font-black text-blue-600 my-4" th:text="${digit}">?</div>
        <div class="inline-block px-4 py-1 rounded-full bg-blue-100 text-blue-800 text-sm font-bold border border-blue-200">
            Bizonyosság: <span th:text="${confidence}">0%</span>
        </div>
    </div>
</div>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
    }
</style>

</body>
</html>
